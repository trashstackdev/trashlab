apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 1h
  chart:
    spec:
      chart: nextcloud
      version: 9.2.6
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    image:
      tag: 34.0.4-apache
    nextcloud:
      host: cloud.trashstack.dev
      existingSecret:
        enabled: true
        secretName: nextcloud
      extraEnv:
        - name: OVERWRITEPROTOCOL
          value: https
        - name: OVERWRITEHOST
          value: cloud.trashstack.dev
        - name: overwrite.cli.url
          value: https://cloud.trashstack.dev
        # Traefik runs in the pod network and forwards the client IP in X-Forwarded-For
        - name: TRUSTED_PROXIES
          value: 10.42.0.0/16
        - name: APACHE_DISABLE_REWRITE_IP
          value: "1"
      phpConfigs:
        opcache.interned_strings_buffer: "10"

    internalDatabase:
      enabled: false

    postgresql:
      enabled: true
      global:
        postgresql:
          auth:
            existingSecret: nextcloud-postgresql
            secretKeys:
              adminPasswordKey: postgres-password
              userPasswordKey: password
      image:
        tag: 16.3.0-debian-12-r10
      # postgres-exporter sidecar (pg_database_size_bytes, connections), connecting as the nextcloud user.
      # Changes only the pod template. Upstream image instead of Bitnami's, which no longer gets updates.
      metrics:
        enabled: true
        image:
          repository: prometheuscommunity/postgres-exporter
          tag: v0.19.1
        serviceMonitor:
          enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      primary:
        # Offsite backup (backup.yaml): k8up stores this dump. The data PVC can't carry k8up.io/backup: "false"
        # (StatefulSet volumeClaimTemplates are immutable), so its live files are copied too: restore from the dump.
        podAnnotations:
          k8up.io/backupcommand: sh -c 'PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")" pg_dump -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DATABASE" --clean --if-exists'
          k8up.io/backupcommand-container: postgresql
          k8up.io/file-extension: .sql
        # Replaces the Bitnami "nano" preset (150m CPU limit throttled Postgres); no CPU limit on purpose
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        persistence:
          enabled: true
          storageClass: longhorn

    redis:
      enabled: true
      auth:
        existingSecret: nextcloud-redis
        existingSecretPasswordKey: redis-password
      master:
        # Replaces the Bitnami "nano" preset; no CPU limit on purpose
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
      replica:
        replicaCount: 0

    persistence:
      enabled: true
      storageClass: longhorn
      size: 50Gi

    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        traefik.ingress.kubernetes.io/router.middlewares: nextcloud-nextcloud-chain@kubernetescrd
      tls:
        - hosts:
            - cloud.trashstack.dev
          secretName: nextcloud-tls

    # Run background jobs (log rotation, trash/version expiry) on a schedule instead of on page loads
    cronjob:
      enabled: true
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 1Gi

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
