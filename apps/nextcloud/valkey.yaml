# Cache and file locking for Nextcloud, replacing the Bitnami redis subchart (bitnamilegacy images).
# No persistence: Nextcloud rebuilds both after a restart. Same password as before (nextcloud-redis).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-valkey
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: nextcloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: nextcloud
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8.1.4-alpine
          args:
            - --requirepass
            - $(VALKEY_PASSWORD)
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 200mb
            - --maxmemory-policy
            - allkeys-lru
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-redis
                  key: redis-password
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-valkey
  namespace: nextcloud
spec:
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: nextcloud
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
