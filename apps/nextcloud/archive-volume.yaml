# Archive for finished files (old documents, videos and backups) on a Hetzner Storage Box sub-account.
# Kept off the local NVMe on purpose. Shown in Nextcloud as the external storage folder "Archive" (helmrelease.yaml).
# The share address is SOPS-encrypted because this repo is public. Edit with: sops apps/nextcloud/archive-volume.yaml
# A PV's source can't change after creation: point to a new sub-account by creating a new PV/PVC pair.
apiVersion: v1
kind: PersistentVolume
metadata:
    name: nextcloud-archive
spec:
    capacity:
        storage: 1Ti
    accessModes:
        - ReadWriteMany
    persistentVolumeReclaimPolicy: Retain
    storageClassName: ""
    mountOptions:
        - vers=3.1.1
        # Encrypt SMB traffic between ex44 and the Storage Box
        - seal
        # www-data, the user Nextcloud's PHP runs as
        - uid=33
        - gid=33
        - dir_mode=0770
        - file_mode=0660
        - nobrl
        - noserverino
    csi:
        driver: smb.csi.k8s.io
        # Must be unique per volume in the cluster
        volumeHandle: nextcloud-archive
        volumeAttributes:
            source: ENC[AES256_GCM,data:kjicOjjLRR0MCrFL5YZieSmdJ9Fo0F5D7ocIhHnF+GrAmaE4cXS+uzm4KWy4tg==,iv:omjH4BNdFyFnn8CFwVBX/zQ2lU5NhgnCjQvakcv62fg=,tag:64ZPPK5T6EMQkO/jNTQ/gg==,type:str]
        nodeStageSecretRef:
            name: nextcloud-archive-smb
            namespace: nextcloud
