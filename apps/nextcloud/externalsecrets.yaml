---
# Storage Box sub-account that holds the archive (SMB), see archive-volume.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-archive-smb
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: nextcloud-archive-smb
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: <bitwarden-secret-id>
    - secretKey: password
      remoteRef:
        key: <bitwarden-secret-id>
---
# Owner login of the CNPG database nextcloud-db (database.yaml): the same password as the old Bitnami database.
# Not named nextcloud-db: the Nextcloud chart owns a Secret of that name while it manages the database.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-cnpg-db
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: nextcloud-cnpg-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: nextcloud
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: <bitwarden-secret-id>
