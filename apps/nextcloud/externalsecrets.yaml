---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-admin
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: nextcloud
    creationPolicy: Owner
  data:
    - secretKey: nextcloud-username
      remoteRef:
        key: <bitwarden-secret-id>
    - secretKey: nextcloud-password
      remoteRef:
        key: <bitwarden-secret-id>
    # serverinfo API token for nextcloud-exporter (helmrelease.yaml, metrics)
    - secretKey: nextcloud-token
      remoteRef:
        key: <bitwarden-secret-id> # nextcloud-serverinfo-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-postgresql
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: nextcloud-postgresql
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: <bitwarden-secret-id>
    - secretKey: postgres-password
      remoteRef:
        key: <bitwarden-secret-id>
---
apiVersion: external-secrets.io/v1
