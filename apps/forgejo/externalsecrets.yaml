---
# Postgres credentials, used by the CNPG bootstrap and by Forgejo
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: forgejo-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: forgejo
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: REPLACE_WITH_BW_UUID # forgejo-db-password
---
# Local break-glass admin. Day to day you log in with Authentik and link to this account once.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: forgejo-admin
    creationPolicy: Owner
    template:
      data:
        username: forgejo-admin
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: REPLACE_WITH_BW_UUID # forgejo-admin-password
---
# OIDC client for Authentik (keys "key" and "secret" as the chart expects)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oauth
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: forgejo-oauth
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: REPLACE_WITH_BW_UUID # forgejo-oidc-client-id
    - secretKey: secret
      remoteRef:
        key: REPLACE_WITH_BW_UUID # forgejo-oidc-client-secret
