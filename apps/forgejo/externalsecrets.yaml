---
# Postgres credentials, used by the CNPG bootstrap and by Forgejo
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: forgejo-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: forgejo
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: 597ebeb1-3f96-4dbd-8b42-b4e700bcc7a7 # forgejo-db-password
---
# Local break-glass admin. Day to day you log in with Authentik and link to this account once.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: forgejo-admin
    creationPolicy: Owner
    template:
      data:
        username: forgejo-admin
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: 50302e35-b590-4859-ad2c-b4e700bcc813 # forgejo-admin-password
---
# OIDC client for Authentik (keys "key" and "secret" as the chart expects)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oauth
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: forgejo-oauth
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: 5de143f7-7d95-4e91-b20f-b4e700bcc868 # forgejo-oidc-client-id
    - secretKey: secret
      remoteRef:
        key: cd865c18-de74-4477-bc39-b4e700bcc8d2 # forgejo-oidc-client-secret
