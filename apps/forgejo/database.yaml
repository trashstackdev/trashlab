---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      secret:
        name: forgejo-db
  enableSuperuserAccess: false
  # Offsite backup (backup.yaml): k8up stores a pg_dump from the instance pod instead of the live data volume.
  # CNPG copies these annotations to the instance pods and PVCs; k8up reads k8up.io/backup only on PVCs
  # and the dump command only on pods.
  inheritedMetadata:
    annotations:
      k8up.io/backup: "false"
      k8up.io/backupcommand: sh -c 'pg_dump -d forgejo --clean --if-exists'
      k8up.io/backupcommand-container: postgres
      k8up.io/file-extension: .sql
