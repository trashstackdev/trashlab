---
# Postgres credentials, used by the CNPG bootstrap and by Dawarich
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dawarich-db
  namespace: dawarich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: dawarich-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: dawarich
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: 7ac6456f-ff14-4056-bc8f-b4e6011d50d6 # dawarich-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dawarich-secret
  namespace: dawarich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: dawarich-secret
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: b7793872-acf7-419c-bc57-b4e6011d5130 # dawarich-secret-key-base
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: 3cc35c56-6101-4db5-9f10-b4e6011d518d # dawarich-oidc-client-id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: e4e0d53e-e2f7-4f0e-9626-b4e6011d5208 # dawarich-oidc-client-secret
