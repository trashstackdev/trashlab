---
# Postgres credentials, used by the CNPG bootstrap and by Dawarich
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dawarich-db
  namespace: dawarich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: dawarich-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: dawarich
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: <bitwarden-secret-id> # dawarich-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dawarich-secret
  namespace: dawarich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: dawarich-secret
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: <bitwarden-secret-id> # dawarich-secret-key-base
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: <bitwarden-secret-id> # dawarich-oidc-client-id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: <bitwarden-secret-id> # dawarich-oidc-client-secret
