apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dawarich
  namespace: dawarich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Translated from upstream docker/docker-compose.yml (1.16.0)
  values:
    controllers:
      dawarich:
        # The data PVC is ReadWriteOnce
        strategy: Recreate
        containers:
          app:
            image: &image
              repository: freikin/dawarich
              tag: 1.17.0
            command: ["web-entrypoint.sh"]
            # Upstream binds "::", which fails when the pod has no IPv6
            args: ["bin/rails", "server", "-p", "3000", "-b", "0.0.0.0"]
            env: &env
              RAILS_ENV: production
              RAILS_LOG_TO_STDOUT: "true"
              SELF_HOSTED: "true"
              STORE_GEODATA: "true"
              TIME_ZONE: Europe/Berlin
              APPLICATION_HOSTS: timeline.trashstack.dev
              # TLS ends at Traefik; "https" here would turn on force_ssl inside the pod
              APPLICATION_PROTOCOL: http
              DOMAIN: timeline.trashstack.dev
              DATABASE_HOST: dawarich-db-rw
              DATABASE_PORT: "5432"
              DATABASE_NAME: dawarich
              DATABASE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: dawarich-db
                    key: username
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: dawarich-db
                    key: password
              REDIS_URL: redis://dawarich-redis:6379
              WEB_CONCURRENCY: "1"
              # Raise temporarily for large imports
              BACKGROUND_PROCESSING_CONCURRENCY: "3"
              OIDC_ISSUER: https://auth.trashstack.dev/application/o/dawarich/
              OIDC_REDIRECT_URI: https://timeline.trashstack.dev/users/auth/openid_connect/callback
              OIDC_PROVIDER_NAME: Authentik
              # Authentik only. Also locks out the seeded demo@dawarich.app admin, which has a public default password.
              ALLOW_EMAIL_PASSWORD_LOGIN: "false"
            envFrom: &envFrom
              # SECRET_KEY_BASE, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET
              - secret: dawarich-secret
            probes:
              # /api/v1/health is the only path exempt from Rails host authorization
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                <<: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  # Migrations run before Puma starts
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
          sidekiq:
            image: *image
            command: ["sidekiq-entrypoint.sh"]
            args: ["sidekiq"]
            env: *env
            envFrom: *envFrom
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi

      redis:
        containers:
          redis:
            image:
              repository: docker.io/library/redis
              tag: 7.4-alpine
            # Only holds Sidekiq queues and cache, so no persistence
            args: ["redis-server", "--save", "", "--appendonly", "no"]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi

    service:
      app:
        controller: dawarich
        ports:
          http:
            port: 3000
      redis:
        controller: redis
        ports:
          redis:
            port: 6379

    ingress:
      app:
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          cert-manager.io/cluster-issuer: letsencrypt-production
        hosts:
          - host: timeline.trashstack.dev
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - timeline.trashstack.dev
            secretName: timeline-trashstack-dev-tls

    persistence:
      data:
        existingClaim: dawarich-data
        advancedMounts:
          dawarich:
            app: &mounts
              - path: /var/app/public
                subPath: public
              - path: /var/app/storage
                subPath: storage
              - path: /var/app/tmp/imports/watched
                subPath: watched
            sidekiq: *mounts
