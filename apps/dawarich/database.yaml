---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dawarich-db
  namespace: dawarich
spec:
  instances: 1
  # Postgres with PostGIS. Upstream compose uses Postgres 17, so stay on 17 and bump by hand.
  imageName: ghcr.io/cloudnative-pg/postgis:17-3.6-standard-trixie
  storage:
    size: 10Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: dawarich
      owner: dawarich
      secret:
        name: dawarich-db
  managed:
    roles:
      # Dedicated cluster: Dawarich's migrations create the PostGIS extension themselves,
      # which needs superuser (PostGIS is not a trusted extension)
      - name: dawarich
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: dawarich-db
  enableSuperuserAccess: false
  # Location history stats on top of the default metrics (monitoring.yaml)
  monitoring:
    customQueriesConfigMap:
      - name: dawarich-db-monitoring
        key: queries
  # Offsite backup (backup.yaml): k8up stores a pg_dump from the instance pod instead of the live data volume.
  # CNPG copies these annotations to the instance pods and PVCs; k8up reads k8up.io/backup only on PVCs
  # and the dump command only on pods.
  inheritedMetadata:
    annotations:
      k8up.io/backup: "false"
      k8up.io/backupcommand: sh -c 'pg_dump -d dawarich --clean --if-exists'
      k8up.io/backupcommand-container: postgres
      k8up.io/file-extension: .sql
