# Self-hosted Renovate for trashstackdev/trashlab, hourly. It works as the restricted Forgejo user renovate:
# Write on this one repo, so it can push branches and open PRs, but main is protected and only the owner
# merges. Clones and API calls go over Forgejo's cluster-internal Service (gitUrl endpoint), not Traefik.
# The repo's renovate.json holds the rules. No onboarding PR, no automerge.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: renovate
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021
            runAsGroup: 12021
            fsGroup: 12021
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              image: ghcr.io/renovatebot/renovate:44.222.3
              env:
                - name: RENOVATE_PLATFORM
                  value: forgejo
                - name: RENOVATE_ENDPOINT
                  value: http://forgejo-http.forgejo.svc.cluster.local:3000/api/v1/
                - name: RENOVATE_GIT_URL
                  value: endpoint
                - name: RENOVATE_REPOSITORIES
                  value: trashstackdev/trashlab
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-token
                      key: token
                # Read-only github.com token for release notes and github.com lookups
                - name: RENOVATE_GITHUB_COM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-token
                      key: github-token
                - name: RENOVATE_GIT_AUTHOR
                  value: Renovate Bot <renovate@git.trashstack.dev>
                - name: RENOVATE_ONBOARDING
                  value: "false"
                - name: RENOVATE_REQUIRE_CONFIG
                  value: required
                # No tool downloads at runtime: the managers in use (flux, kubernetes, regex) need none
                - name: RENOVATE_BINARY_SOURCE
                  value: global
                - name: RENOVATE_BASE_DIR
                  value: /tmp/renovate
                - name: LOG_LEVEL
                  value: info
                - name: LOG_FORMAT
                  value: json
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/ubuntu
          volumes:
            # Clone, caches and Helm index downloads; gone after every run
            - name: tmp
              emptyDir:
                sizeLimit: 4Gi
            - name: home
              emptyDir:
                sizeLimit: 256Mi
