# token: access token of the Forgejo user renovate (restricted, Write collaborator on trashstackdev/trashlab
# only), scopes write:repository, write:issue, read:user, read:organization.
# github-token: a github.com token that only reads public repositories, for release notes in PR descriptions
# and a higher API limit on github.com lookups. It can't write anything.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-token
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: renovate-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: <bitwarden-secret-id>
    - secretKey: github-token
      remoteRef:
        key: <bitwarden-secret-id>
