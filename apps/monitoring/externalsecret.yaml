apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: <bitwarden-secret-id>
    - secretKey: admin-password
      remoteRef:
        key: <bitwarden-secret-id>
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: grafana-oauth
    creationPolicy: Owner
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef:
        key: <bitwarden-secret-id>
---
# Discord #alerts webhook for Alertmanager (same Bitwarden item as flux-discord-alerts)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: alertmanager-discord
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: <bitwarden-secret-id>
---
# healthchecks.io ping URL for the dead man's switch (Alertmanager Watchdog)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-healthchecks
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: alertmanager-healthchecks
    creationPolicy: Owner
  data:
    - secretKey: ping-url
      remoteRef:
        key: <bitwarden-secret-id> # healthchecks-ping-url
---
# Read-only Hetzner Console API token for hcloud-exporter (infrastructure/controllers/hcloud-exporter)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hcloud-exporter
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: hcloud-exporter
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: <bitwarden-secret-id> # hetzner-api-token-readonly
