apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-healthchecks
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: alertmanager-healthchecks
    creationPolicy: Owner
  data:
    - secretKey: ping-url
      remoteRef:
        key: 6df79239-13fa-41ce-8e75-b4e700769de9 # healthchecks-ping-url
---
# Read-only Hetzner Console API token for hcloud-exporter (infrastructure/controllers/hcloud-exporter)
