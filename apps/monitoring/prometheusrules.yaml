apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trashlab
  namespace: monitoring
spec:
  groups:
    - name: backups
      rules:
        # longhorn_backup_state: 0=New, 1=Pending, 2=InProgress, 3=Completed, 4=Error, 5=Unknown
        - alert: LonghornBackupFailed
          expr: longhorn_backup_state == 4
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn backup {{ $labels.backup }} of volume {{ $labels.volume }} failed"
            description: "Check the backup target and the backup in the Longhorn UI. Delete the failed backup once fixed, or this keeps firing."
        - alert: LonghornBackupStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="backup-daily"} > 26 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Longhorn backup-daily has not succeeded for {{ $value | humanizeDuration }}"
            description: "Check the backup-daily job pods in longhorn-system and the backup target."
        - alert: LonghornBackupNeverSucceeded
          expr: kube_cronjob_info{namespace="longhorn-system", cronjob="backup-daily"} unless on(namespace, cronjob) kube_cronjob_status_last_successful_time
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "Longhorn backup-daily has never completed successfully"
            description: "The CronJob exists but has no successful run. Check its job pods in longhorn-system."
        # k8up offsite backups to B2 (infrastructure/controllers/k8up). The operator's own counters reset when it
        # restarts, so staleness comes from kube-state-metrics jobs with the k8up.io/type label.
        - alert: K8upJobFailed
          expr: k8up_schedule_last_job_succeeded == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "k8up {{ $labels.jobType }} of {{ $labels.namespace }} to B2 failed"
            description: "Check the {{ $labels.jobType }} job pods in {{ $labels.namespace }} (kubectl -n {{ $labels.namespace }} get backups,checks,prunes)."
        - alert: K8upBackupStale
          expr: time() - max by (namespace) (kube_job_status_completion_time * on(namespace, job_name) group_left() kube_job_labels{label_k8up_io_type="backup"}) > 26 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "No successful offsite backup of {{ $labels.namespace }} for {{ $value | humanizeDuration }}"
            description: "Check the k8up Schedule and the backup job pods in {{ $labels.namespace }}."
        - alert: K8upBackupNeverSucceeded
          expr: max by (namespace) (k8up_schedules_gauge) > 0 unless on(namespace) (kube_job_status_completion_time * on(namespace, job_name) group_left() kube_job_labels{label_k8up_io_type="backup"})
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "The offsite backup of {{ $labels.namespace }} has never completed successfully"
            description: "The k8up Schedule exists but no backup job has succeeded. Check its job pods and the offsite-backup Secret in {{ $labels.namespace }}."
        # k8up counts a backup as successful even when restic couldn't read some files (exit code 3), so watch
        # restic's own error count, pushed through the Pushgateway. Skips the raw Bitnami Postgres and Redis
        # volumes: files vanish there while the database runs, and their SQL dumps are the real backup.
        - alert: K8upResticErrors
          expr: k8up_backup_restic_last_errors{pvc!~"data-.+-postgresql-0|redis-data-.+"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Offsite backup of {{ $labels.namespace }}/{{ $labels.pvc }} had {{ $value }} restic errors"
            description: "k8up still reports the backup as successful, but some files are missing from it. Check the newest backup pod logs in {{ $labels.namespace }} for files restic could not read."
    - name: secrets
      rules:
        - alert: ExternalSecretNotSynced
          expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} is not syncing from Bitwarden SM"
            description: "Workloads keep the last synced value. Check the ExternalSecret events and the bitwarden-sdk-server pod in external-secrets."
    # Metrics behind the trashlab overview dashboard (apps/monitoring/dashboards)
    - name: overview
      rules:
        # hcloud-exporter (infrastructure/controllers/hcloud-exporter); sizes include snapshots
        - alert: StorageBoxAlmostFull
          expr: hcloud_storagebox_general_size / hcloud_storagebox_quota > 0.85
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Storage Box {{ $labels.name }} is {{ $value | humanizePercentage }} full"
            description: "Delete old snapshots or data, or move to a larger box in the Hetzner Console. Longhorn backups and Immich's library fail once it's full."
        # Dawarich's CNPG custom query (apps/dawarich/monitoring.yaml): the recording time of the newest point
        - alert: DawarichNoNewPoints
          expr: time() - cnpg_dawarich_points_newest_seconds > 24 * 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "No new Dawarich location point from {{ $labels.owner }} for {{ $value | humanizeDuration }}"
            description: "iPhone tracking has probably stopped. Check the Dawarich app's tracking settings and the dawarich pod logs."
        # b2-usage CronJob (apps/monitoring/b2-usage.yaml) pushes hourly; the Pushgateway sets push_time_seconds.
        # Fires 3 hours after the last push. The Pushgateway keeps nothing across restarts, so absence only counts
        # after two hours.
        - alert: B2UsageStale
          expr: time() - max(push_time_seconds{job="b2_usage"}) > 3600 or absent(push_time_seconds{job="b2_usage"})
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "The b2-usage job has stopped pushing B2 sizes"
            description: "Check the b2-usage job pods in monitoring (kubectl -n monitoring get jobs) and the b2-usage ExternalSecret."
