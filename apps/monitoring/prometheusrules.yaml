apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trashlab
  namespace: monitoring
spec:
  groups:
    - name: backups
      rules:
        # longhorn_backup_state: 0=New, 1=Pending, 2=InProgress, 3=Completed, 4=Error, 5=Unknown
        - alert: LonghornBackupFailed
          expr: longhorn_backup_state == 4
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn backup {{ $labels.backup }} of volume {{ $labels.volume }} failed"
            description: "Check the backup target and the backup in the Longhorn UI. Delete the failed backup once fixed, or this keeps firing."
        - alert: LonghornBackupStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="backup-daily"} > 26 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Longhorn backup-daily has not succeeded for {{ $value | humanizeDuration }}"
            description: "Check the backup-daily job pods in longhorn-system and the backup target."
        - alert: LonghornBackupNeverSucceeded
          expr: kube_cronjob_info{namespace="longhorn-system", cronjob="backup-daily"} unless on(namespace, cronjob) kube_cronjob_status_last_successful_time
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "Longhorn backup-daily has never completed successfully"
            description: "The CronJob exists but has no successful run. Check its job pods in longhorn-system."
        # k8up offsite backups to B2 (infrastructure/controllers/k8up). The operator's own counters reset when it
        # restarts, so staleness comes from kube-state-metrics jobs with the k8up.io/type label.
        - alert: K8upJobFailed
          expr: k8up_schedule_last_job_succeeded == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "k8up {{ $labels.jobType }} of {{ $labels.namespace }} to B2 failed"
            description: "Check the {{ $labels.jobType }} job pods in {{ $labels.namespace }} (kubectl -n {{ $labels.namespace }} get backups,checks,prunes)."
        - alert: K8upBackupStale
          expr: time() - max by (namespace) (kube_job_status_completion_time * on(namespace, job_name) group_left() kube_job_labels{label_k8up_io_type="backup"}) > 26 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "No successful offsite backup of {{ $labels.namespace }} for {{ $value | humanizeDuration }}"
            description: "Check the k8up Schedule and the backup job pods in {{ $labels.namespace }}."
        - alert: K8upBackupNeverSucceeded
          expr: max by (namespace) (k8up_schedules_gauge) > 0 unless on(namespace) (kube_job_status_completion_time * on(namespace, job_name) group_left() kube_job_labels{label_k8up_io_type="backup"})
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "The offsite backup of {{ $labels.namespace }} has never completed successfully"
            description: "The k8up Schedule exists but no backup job has succeeded. Check its job pods and the offsite-backup Secret in {{ $labels.namespace }}."
    - name: secrets
      rules:
        - alert: ExternalSecretNotSynced
          expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} is not syncing from Bitwarden SM"
            description: "Workloads keep the last synced value. Check the ExternalSecret events and the bitwarden-sdk-server pod in external-secrets."
