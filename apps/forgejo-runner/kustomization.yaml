apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - externalsecret.yaml
  - networkpolicy.yaml
  - deployment.yaml
# The name gets a content hash, so a config change rolls the runner
configMapGenerator:
  - name: forgejo-runner-config
    namespace: forgejo-runner
    files:
      - config.yaml
