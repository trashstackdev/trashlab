# The runner's token: 40 hex characters, registered in Forgejo with
# `forgejo forgejo-cli actions register --scope trashstackdev --name trashlab`.
# The first 16 characters are the runner's public identifier (<runner-id>, which gives the uuid in
# config.yaml), the other 24 are the secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-token
  namespace: forgejo-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: forgejo-runner-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: <bitwarden-secret-id>
