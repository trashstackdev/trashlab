---
# Credentials for the offsite backup (see infrastructure/controllers/k8up/helmrelease.yaml).
# The keys are restic environment variable names, because the Schedule also loads this Secret with envFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: offsite-backup
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: offsite-backup
    creationPolicy: Owner
    template:
      data:
        RESTIC_PASSWORD: "{{ .password }}"
        AWS_ACCESS_KEY_ID: "{{ .keyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .key }}"
        # The bucket's region, matching the endpoint in the Schedule
        AWS_DEFAULT_REGION: eu-central-003
  data:
    - secretKey: password
      remoteRef:
        key: PLACEHOLDER # restic-backup-password
    - secretKey: keyId
      remoteRef:
        key: PLACEHOLDER # b2-backup-key-id
    - secretKey: key
      remoteRef:
        key: PLACEHOLDER # b2-backup-key
---
# Daily offsite backup of every PVC in this namespace that isn't annotated k8up.io/backup: "false".
# The database is saved as a pg_dump through the postgresql pod annotations in helmrelease.yaml.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: offsite
  namespace: authentik
spec:
  backend:
    repoPasswordSecretRef:
      name: offsite-backup
      key: RESTIC_PASSWORD
    s3:
      endpoint: https://s3.eu-central-003.backblazeb2.com
      # One restic repository per namespace
      bucket: trashlab-backup-33b2e1/authentik
      accessKeyIDSecretRef:
        name: offsite-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKeySecretRef:
        name: offsite-backup
        key: AWS_SECRET_ACCESS_KEY
    envFrom:
      - secretRef:
          name: offsite-backup
  # restic must read files owned by any app user. k8up counts unreadable files (restic exit code 3)
  # as a successful backup, so a non-root user would silently leave files out.
  podSecurityContext:
    runAsUser: 0
  resourceRequirementsTemplate:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 2Gi
  # Europe/Berlin (k8up.timezone): after Immich's 02:00 database dump and the 03:00 Longhorn backup,
  # staggered per namespace
  backup:
    schedule: "0 4 * * *"
  prune:
    schedule: "0 5 * * 0"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 12
  check:
    schedule: "0 6 * * 0"
