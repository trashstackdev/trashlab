---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret-key
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: authentik-secret
    creationPolicy: Owner
  data:
    - secretKey: secret_key
      remoteRef:
        key: <bitwarden-secret-id>
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgresql
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: authentik-postgresql
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: <bitwarden-secret-id>
    - secretKey: postgres-password
      remoteRef:
        key: <bitwarden-secret-id>
