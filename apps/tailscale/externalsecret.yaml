# OAuth client of the operator, made under Trust credentials in the Tailscale admin console with write access
# to General/Services, Devices/Core and Keys/Auth Keys, tag tag:k8s-operator. Mounted as files by
# oauthSecretVolume in helmrelease.yaml, so the chart creates no Secret of its own.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: tailscale-operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: <bitwarden-secret-id>
    - secretKey: client_secret
      remoteRef:
        key: <bitwarden-secret-id>
