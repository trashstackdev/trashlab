# Photo library (originals, uploads, profile pictures, DB dumps) on a Hetzner Storage Box sub-account.
# Too big for the local NVMe. Protected by Storage Box snapshots, not by Longhorn backups.
# The share address is SOPS-encrypted because this repo is public. Edit with: sops apps/immich/library-volume.yaml
# A PV's source can't change after creation: point to a new sub-account by creating a new PV/PVC pair.
apiVersion: v1
kind: PersistentVolume
metadata:
    name: immich-library-v2
spec:
    capacity:
        storage: 1Ti
    accessModes:
        - ReadWriteMany
    persistentVolumeReclaimPolicy: Retain
    storageClassName: ""
    mountOptions:
        - vers=3.1.1
        # Encrypt SMB traffic between ex44 and the Storage Box
        - seal
        - dir_mode=0770
        - file_mode=0660
        - nobrl
        - noserverino
    csi:
        driver: smb.csi.k8s.io
        # Must be unique per volume in the cluster
        volumeHandle: immich-library-v2
        volumeAttributes:
            source: ENC[AES256_GCM,data:WOhkFHmCig/isahpZlySE80RnpTpd8Hi3MVk8JjDY8UBKx9LEydil3N365FdjS9RLGCBl+D58PeOXOI6FT2Sy2bz9KY=,iv:kO5+r4ee8jTjaKhn4rgb4Z0CF0EljFo6yaNCiWxCnsw=,tag:vQkiMfW22aLETP5f/yronA==,type:str]
        nodeStageSecretRef:
            name: immich-smb
            namespace: immich
sops:
