---
# Photo library (originals, uploads, profile pictures, DB dumps) on a Hetzner Storage Box sub-account.
# Too big for the local NVMe. Protected by Storage Box snapshots, not by Longhorn backups.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - vers=3.1.1
    # Encrypt SMB traffic between ex44 and the Storage Box
    - seal
    - dir_mode=0770
    - file_mode=0660
    - nobrl
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    # Must be unique per volume in the cluster
    volumeHandle: immich-library
    volumeAttributes:
      source: //u693832-sub1.your-storagebox.de/u693832-sub1
    nodeStageSecretRef:
      name: immich-smb
      namespace: immich
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: immich-library
  resources:
    requests:
      storage: 1Ti
---
# Thumbnails and transcoded videos on local NVMe for a fast UI. Immich regenerates them, so no backups.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-thumbs
  namespace: immich
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/no-backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
# Machine learning models, downloaded again if lost
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
  namespace: immich
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/no-backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
