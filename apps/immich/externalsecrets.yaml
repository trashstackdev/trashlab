---
# Postgres credentials, used by the CNPG bootstrap and by Immich
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: immich-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: immich
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: <bitwarden-secret-id> # immich-db-password
---
# Storage Box sub-account that holds the photo library (SMB)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-smb
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: immich-smb
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: <bitwarden-secret-id> # immich-smb-username
    - secretKey: password
      remoteRef:
        key: <bitwarden-secret-id> # immich-smb-password
---
# Immich config file (IMMICH_CONFIG_FILE). Lives in an ESO-managed Secret because it holds the OIDC client secret.
# Unset keys keep Immich's defaults (daily DB dump keeping 14, storage template {y}/{y}-{MM}-{dd}/{filename}).
# Settings set here are read-only in the Immich admin UI.
# Immich only reads this file at startup: after changing it, run `kubectl -n immich rollout restart deploy/immich-server`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: immich-config
    creationPolicy: Owner
    template:
      data:
        immich-config.yaml: |
          server:
            externalDomain: https://photos.trashstack.dev
          oauth:
            enabled: true
            issuerUrl: https://auth.trashstack.dev/application/o/immich/
            endSessionEndpoint: https://auth.trashstack.dev/application/o/immich/end-session/
            clientId: "{{ .clientId }}"
            clientSecret: "{{ .clientSecret }}"
            buttonText: Login with Authentik
            autoRegister: true
            # Storage limit in GiB for accounts created at first Authentik login; change it per user under Administration, Users
            defaultStorageQuota: 50
          # Authentik only (the admin account is linked to Authentik)
          passwordLogin:
            enabled: false
          # Sort originals into year/date folders, so the library is easy to browse on the Storage Box
          storageTemplate:
            enabled: true
  data:
    - secretKey: clientId
      remoteRef:
        key: <bitwarden-secret-id> # immich-oidc-client-id
    - secretKey: clientSecret
      remoteRef:
        key: <bitwarden-secret-id> # immich-oidc-client-secret
