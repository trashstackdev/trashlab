---
# Postgres credentials, used by the CNPG bootstrap and by Immich
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: immich-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: immich
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ab03b7b2-4338-4507-8db3-b4e6011d4f2b # immich-db-password
---
# Storage Box sub-account that holds the photo library (SMB)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-smb
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: immich-smb
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: 6bd25977-04b2-4d48-8f36-b4e6011d4f7f # immich-smb-username
    - secretKey: password
      remoteRef:
        key: 75c60be3-3cdc-4198-b0b0-b4e6011d4fcc # immich-smb-password
---
# Immich config file (IMMICH_CONFIG_FILE). Lives in an ESO-managed Secret because it holds the OIDC client secret.
# Unset keys keep Immich's defaults (daily DB dump keeping 14, storage template {y}/{y}-{MM}-{dd}/{filename}).
# Settings set here are read-only in the Immich admin UI.
# Immich only reads this file at startup: after changing it, run `kubectl -n immich rollout restart deploy/immich-server`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: immich-config
    creationPolicy: Owner
    template:
      data:
        immich-config.yaml: |
          server:
            externalDomain: https://photos.trashstack.dev
          oauth:
            enabled: true
            issuerUrl: https://auth.trashstack.dev/application/o/immich/
            endSessionEndpoint: https://auth.trashstack.dev/application/o/immich/end-session/
            clientId: "{{ .clientId }}"
            clientSecret: "{{ .clientSecret }}"
            buttonText: Login with Authentik
            autoRegister: true
          # Keep until Authentik login works on the web and in the iOS app, then set to false
          passwordLogin:
            enabled: true
          # Sort originals into year/date folders, so the library is easy to browse on the Storage Box
          storageTemplate:
            enabled: true
  data:
    - secretKey: clientId
      remoteRef:
        key: 25eda200-b54c-44f6-9eb0-b4e6011d5023 # immich-oidc-client-id
    - secretKey: clientSecret
      remoteRef:
        key: d3748858-7498-44f4-b100-b4e6011d5073 # immich-oidc-client-secret
