---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  releaseName: flux-operator
  upgrade:
    crds: CreateReplace
  chartRef:
    kind: OCIRepository
    name: flux-operator
    namespace: flux-system
  values:
    # flux_resource_info{kind,name,ready,suspended,...} for every Flux object, for the overview dashboard
    serviceMonitor:
      create: true
    # How often the operator refreshes those metrics (default 5m)
    reporting:
      interval: 30s
