---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: kube-system
spec:
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: traefik
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      version: 41.5.0
  interval: 1m0s
  releaseName: traefik
  values:
    api:
      insecure: true
    metrics:
      prometheus:
        entryPoint: metrics
    ports:
      metrics:
        port: 9100
        expose:
          default: false
      websecure:
        transport:
          respondingTimeouts:
            # Traefik v3 cuts requests off after 60s, which breaks large uploads (Immich videos over mobile data)
            readTimeout: 600s
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    service:
      spec:
        # Keep client source IPs (single node, so there is no cross-node hop to lose).
        # Apps behind Traefik must trust the pod network (10.42.0.0/16) for X-Forwarded-For.
        externalTrafficPolicy: Local
