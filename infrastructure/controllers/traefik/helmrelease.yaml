---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: kube-system
spec:
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: traefik
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      version: 41.5.0
  interval: 1m0s
  releaseName: traefik
  values:
    api:
      insecure: true
    metrics:
      prometheus:
        entryPoint: metrics
    ports:
      metrics:
        port: 9100
        expose:
          default: false
      websecure:
        transport:
          respondingTimeouts:
            # Traefik v3 cuts requests off after 60s, which breaks large uploads (Immich videos over mobile data)
            readTimeout: 600s
    # ~130 MiB typical (Oct 2026)
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Access log only for failed (5xx) and slow (>60s) requests, to keep it small.
    # Headers (chart default) and query parameters (share keys, tokens) are dropped.
    accessLog:
      enabled: true
      format: json
      filters:
        statusCodes: "500-599"
        minDuration: 60s
      fields:
        queryParameters:
          defaultMode: drop
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    service:
      spec:
        # Keep client source IPs (single node, so there is no cross-node hop to lose).
        # Apps behind Traefik must trust the pod network (10.42.0.0/16) for X-Forwarded-For.
        externalTrafficPolicy: Local
