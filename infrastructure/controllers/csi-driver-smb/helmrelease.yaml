---
# SMB/CIFS volumes, used to mount Hetzner Storage Box shares (Immich photo library)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-smb
  namespace: kube-system
spec:
  interval: 1h
  releaseName: csi-driver-smb
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: csi-driver-smb
      version: 1.20.3
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: csi-driver-smb
        namespace: flux-system
