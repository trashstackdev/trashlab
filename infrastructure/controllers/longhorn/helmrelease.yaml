---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      version: 1.13.0
  interval: 1m0s
  releaseName: longhorn
  values:
    # Since Longhorn 1.8 the backup target lives here, not under defaultSettings
    defaultBackupStore:
      backupTarget: "cifs://u409469.your-storagebox.de/backup"
      backupTargetCredentialSecret: "cifs-secret"
    defaultSettings:
      defaultReplicaCount: 1
      # Move volume engines to the new default engine after each Longhorn upgrade
      # (live for attached volumes, offline for detached ones)
      concurrentAutomaticEngineUpgradePerNodeLimit: 3
      # Keep false: when true, every trim-daily run purges the latest snapshot chain,
      # including manual snapshots and the base the next incremental backup builds on
      removeSnapshotsDuringFilesystemTrim: false
      # One node with two disks: a volume with two replicas keeps one on each disk. The first setting allows
      # two replicas on the same node at all, the second forbids putting both on the same disk.
      # Which volumes get two replicas is set per volume (the databases), the default stays one.
      replicaSoftAntiAffinity: true
      replicaDiskSoftAntiAffinity: false
    persistence:
      defaultClassReplicaCount: 1
