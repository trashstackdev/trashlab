---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 1h
  releaseName: reloader
  install:
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: reloader
      version: 2.2.18
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  # Opt-in only: workloads restart when they carry a
  # secret.reloader.stakater.com/reload or configmap.reloader.stakater.com/reload annotation
  values: {}
