---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 1h
  releaseName: reloader
  install:
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: reloader
      version: 2.2.18
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  # Opt-in only: workloads restart when they carry a
  # secret.reloader.stakater.com/reload or configmap.reloader.stakater.com/reload annotation
  values:
    reloader:
      # Restart through a pod template annotation instead of an injected env var (less Helm drift)
      reloadStrategy: annotations
      # Catch up on Secret changes that happened while Reloader was down
      reloadOnCreate: true
      syncAfterRestart: true
      # Watch only namespaces with opted-in workloads, not every Secret in the cluster
      watchGlobally: false
      namespaces:
        - external-secrets
        - monitoring
