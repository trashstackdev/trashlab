# Credentials of the GitRepository trashlab-private (clusters/trashlab/private.yaml): the Forgejo user
# flux-reader with a token limited to read:repository, a Read collaborator on that one repo.
# Lives here and not next to the GitRepository: the root sync runs before the ExternalSecret CRD exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trashlab-private-git
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: trashlab-private-git
    creationPolicy: Owner
    template:
      data:
        username: flux-reader
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        # WIP: placeholder until the token is in Bitwarden
        key: 00000000-0000-0000-0000-000000000000
