---
# Both issuers existed only in the cluster, so a rebuilt cluster could not issue any certificate.
# Used by the bitwarden-sdk-server certificate.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# Let's Encrypt for every public host. The optional contact address is left out on purpose:
# this repository is public.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      - selector: {}
        http01:
          ingress:
            class: traefik
---
# Let's Encrypt through Cloudflare DNS-01, for the wildcard certificate (wildcard-certificate.yaml).
# DNS-01 is the only challenge that can issue a wildcard. The token is limited to the trashstack.dev zone.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns
    solvers:
      - selector:
          dnsZones:
            - trashstack.dev
        dns01:
          cloudflare:
            # A ClusterIssuer reads secrets from cert-manager's own namespace
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
