# Cloudflare API token for the DNS-01 issuer letsencrypt-dns (clusterissuers.yaml).
# Permissions: Zone DNS Edit and Zone Read, for the zone trashstack.dev only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        # WIP: placeholder until the token is in Bitwarden
        key: 00000000-0000-0000-0000-000000000000
