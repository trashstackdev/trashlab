# cnpg-system: no pod is a client of the operator. The API server calls the webhook on 9443 from the node,
# which kube-router accepts before any policy. The operator's calls to each instance on 8000 are egress here
# and need rules in the database namespaces (dawarich, forgejo, immich).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cnpg-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
