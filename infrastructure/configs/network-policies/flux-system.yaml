# flux-system: Flux controllers and the Flux Operator. Replaces apps/flux-ui/networkpolicy.yaml (allow-traefik-ingress).
# Narrow only once the operator's allow-egress, allow-scraping and allow-webhooks and the chart's flux-operator-web are
# gone, because policies add up.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: flux-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The Flux components talk to each other: artifacts from source-controller (9090) and events to notification-controller
# (9090). All ports between them, so Flux can always reconcile its own fixes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: flux-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Prometheus scrapes the four controllers (PodMonitor flux-system) and the operator (ServiceMonitor) on 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus
  namespace: flux-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
---
# Flux UI (flux.trashstack.dev) through Traefik, and Homepage's siteMonitor
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-ui
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homepage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: homepage
      ports:
        - protocol: TCP
          port: 9080
---
# cert-manager HTTP-01 solver for flux-trashstack-dev-tls, reached through Traefik
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-http01-solver
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8089
---
# Forgejo's push webhook to the Receiver forgejo (infrastructure/configs/notifications/receiver.yaml) on
# notification-controller's webhook port. Only the Forgejo pod; the signature check does the rest.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-forgejo-webhook
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app: notification-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
          podSelector:
            matchLabels:
              app.kubernetes.io/name: forgejo
              app.kubernetes.io/instance: forgejo
      ports:
        - protocol: TCP
          port: 9292
