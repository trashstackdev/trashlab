# external-secrets: the API server (webhook on 10250) and kubelet probes come from the node and need no rule.
# The Certificate bitwarden-tls-certs uses the selfsigned ClusterIssuer, so no HTTP-01 solver runs here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The chart's three ServiceMonitors (serviceMonitor.enabled in the HelmRelease)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus
  namespace: external-secrets
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - external-secrets
          - external-secrets-cert-controller
          - external-secrets-webhook
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
---
# Only the controller talks to the Bitwarden SDK server (ClusterSecretStore bitwarden, bitwardenServerSDKURL).
# The SDK server holds the machine account session: no other pod should reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bitwarden-sdk-server
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bitwarden-sdk-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets
      ports:
        - protocol: TCP
          port: 9998
