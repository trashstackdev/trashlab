apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Ingress policies of the system namespaces (security re-check 2026-11-16). App namespaces keep theirs next to the app.
resources:
  - kube-system.yaml
  - flux-system.yaml
  - monitoring.yaml
  - cert-manager.yaml
  - cnpg-system.yaml
  - external-secrets.yaml
  - k8up.yaml
  - reloader.yaml
  - default.yaml
