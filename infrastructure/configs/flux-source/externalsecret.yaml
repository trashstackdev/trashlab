# Credentials of the root sync (FluxInstance sync.pullSecret in clusters/trashlab/flux-instance.yaml): the
# Forgejo user flux-reader with a token limited to read:repository, a Read collaborator on trashstackdev/trashlab.
# Lives here and not next to the FluxInstance: the root sync runs before the ExternalSecret CRD exists.
# The name dates from the separate trashlab-private repo. A rename means a new Secret that the sync
# needs before it can fetch the commit that creates it, so it stays.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trashlab-private-git
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: trashlab-private-git
    # Orphan: the Secret has no owner reference, so it survives if this ExternalSecret is ever deleted or
    # pruned (a bad commit to infrastructure/configs). With Owner, the Secret would go with it, and Flux could
    # no longer fetch the commit that fixes it. External Secrets drops its owner reference from the existing
    # Secret on the next sync after the switch (applyOwnership, v2.15).
    creationPolicy: Orphan
    template:
      data:
        username: flux-reader
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: <bitwarden-secret-id>
