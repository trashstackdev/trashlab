---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-discord-alerts
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: flux-discord-alerts
  data:
    - secretKey: address
      remoteRef:
        key: <bitwarden-secret-id>
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-discord-audit
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: flux-discord-audit
  data:
    - secretKey: address
      remoteRef:
        key: <bitwarden-secret-id>
---
# Shared secret of the Receiver forgejo (receiver.yaml), the same value as in the webhook's settings in Forgejo
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-webhook-token
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: flux-webhook-token
  data:
    - secretKey: token
      remoteRef:
        key: <bitwarden-secret-id>
