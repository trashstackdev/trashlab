# Login of the Storage Box sub-account that holds only Longhorn's backups (base directory longhorn/).
# Replaces the hand-made cifs-secret with the box's main account. The backup target URL is built here and
# handed to the HelmRelease through valuesFrom, so the sub-account name stays out of the repo.
# seal: SMB 3 encryption on the wire; soft is Longhorn's default and has to be repeated once options are set.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-cifs
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: longhorn-backup-cifs
    creationPolicy: Owner
    template:
      data:
        CIFS_USERNAME: "{{ .username }}"
        CIFS_PASSWORD: "{{ .password }}"
        # A YAML snippet, not a plain value: Flux parses targetPath values like helm --set, which splits at commas
        values.yaml: |
          defaultBackupStore:
            backupTarget: "cifs://{{ .username }}.your-storagebox.de/{{ .username }}?cifsOptions=vers=3.1.1,seal,soft"
  data:
    - secretKey: username
      remoteRef:
        key: <bitwarden-secret-id>
    - secretKey: password
      remoteRef:
        key: <bitwarden-secret-id>
